# Voicely: voice conversion platform built on RVC.
#
#   cp .env.example .env      # then set SECRET_KEY
#   docker compose up -d --build
#   open http://127.0.0.1:8080
#
# For an NVIDIA GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

name: voicely

services:
  web:
    build: ./web
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://voicely:${POSTGRES_PASSWORD:-voicely}@postgres:5432/voicely
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      MAX_AUDIO_MINUTES: ${MAX_AUDIO_MINUTES:-10}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  # One-shot download of the shared base models (about 1.1 GB, first run only).
  # It is the only engine-side container with internet access.
  models:
    build: &worker-build
      context: ./worker
      args:
        ENGINE_DEVICE: ${ENGINE_DEVICE:-cpu}
    image: voicely-worker:${ENGINE_DEVICE:-cpu}
    command: ["python", "-m", "voicely_worker.bootstrap"]
    volumes:
      - models:/models
    networks: [edge]
    restart: "no"

  # The pinned RVC runtime. It loads user-supplied model files, so it gets no
  # internet, no database access and no secrets: only Redis and the data volume.
  worker:
    build: *worker-build
    image: voicely-worker:${ENGINE_DEVICE:-cpu}
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUES: ${WORKER_QUEUES:-fast,train}
      VOICE_CACHE_SIZE: ${VOICE_CACHE_SIZE:-2}
      MDX_DENOISE: ${MDX_DENOISE:-0}
      WORKER_MAX_RSS_MB: ${WORKER_MAX_RSS_MB:-5000}
      # Set together, these cut peak memory for a 140 s conversion from 6.1 GB to
      # 3.7 GB in testing (they were not measured separately).
      MALLOC_ARENA_MAX: "2"
      ONEDNN_PRIMITIVE_CACHE_CAPACITY: "8"
    volumes:
      - data:/data
      - models:/models:ro
    shm_size: 2gb          # the trainer's data loader workers share tensors here
    depends_on:
      redis:
        condition: service_healthy
      models:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voicely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicely}
      POSTGRES_DB: voicely
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicely -d voicely"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true   # no route to the internet

volumes:
  data: {}       # uploads, results, voice models, training datasets
  models: {}     # shared base models (HuBERT, RMVPE, separation, narrators)
  pgdata: {}
  redisdata: {}
